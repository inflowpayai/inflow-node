coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%
        only_pulls: true

ignore:
  - '.github/**'
  - '.changeset/**'
  - 'docs/**'
  - 'examples/**'
  - 'scripts/**'
  - '**/*.md'
  - '**/*.yml'
  - '**/*.yaml'
